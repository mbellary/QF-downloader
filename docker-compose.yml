services:
  qf-app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: qf-downloader-dev
    environment:
      APP_ENV: ${APP_ENV:-localstack}
      LOCALSTACK_URL: http://host.docker.internal:4566
    env_file:
      - ./src/qf_downloader/.env.dev
    volumes:
      - ./:/qf-downloader
    command: ["worker", "run"]

