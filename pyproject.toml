[project]
name = "QF-downloader"
version = "0.1.0"
description = "Async data ingestion package for price + macro event sources (EUR/USD) with S3 upload."
authors = [{name = "Your Name", email = "you@example.com"}]
readme = "README.md"
requires-python = ">=3.13"


dependencies = [
    "aiohttp>=3.8.4",
    "aioboto3>=11.0.0",
    "aiosqlite>=0.18.0",
    "python-dotenv>=1.0.0",
    "typer>=0.9.0",
    "PyYAML>=6.0",
    "tenacity>=8.2.2",
    "awscli-local>=0.22.2"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.10.0",
    "ruff>=0.8.0",
    "boto3>=1.26.0",
    "localstack-client>=1.29.0"
]
 

[project.scripts]
worker_incremental = "qf_downloader.cli:run" # nightly trainig
worker_historical = "qf_downloader.cli:app" #historical training

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["src/qf_downloader"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]  # import sorting rules